spring.application.name=travel360endpoints-3
server.port=8080
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/travel360db99
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.generate-ddl=true
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT signing key (HMAC-SHA, >= 256 bits / 32+ chars). DEV-ONLY value; a SECRET_KEY env var overrides this. Replace before production.
SECRET_KEY=${SECRET_KEY}
