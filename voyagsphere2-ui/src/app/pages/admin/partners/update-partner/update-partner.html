<div
  class="container py-4"
  style="margin-left: 280px; width: calc(100% - 280px);">

  <div class="card shadow border-0">

    <!-- Header -->
    <div class="card-header bg-primary text-white">
      <h3 class="mb-0">
        <i class="bi bi-pencil-square me-2"></i>
        Update Partner
      </h3>
    </div>

    <div class="card-body">

      <!-- Load Partner -->
      <div class="mb-4">
        <label class="form-label fw-semibold">
          Partner ID
        </label>

        <div class="input-group">
          <span class="input-group-text bg-white">
            <i class="bi bi-hash"></i>
          </span>

          <input
            type="number"
            class="form-control"
            [(ngModel)]="partnerId"
            name="partnerId"
            placeholder="Enter Partner ID">

          <button
            class="btn btn-primary"
            type="button"
            [disabled]="isLoading"
            (click)="loadPartner()">

            <i class="bi bi-search me-1"></i>

            {{
              isLoading
                ? 'Loading...'
                : 'Load Partner'
            }}
          </button>
        </div>
      </div>

      <hr>

      @if (partner) {

      <h5 class="text-primary mb-4">
        <i class="bi bi-card-list me-2"></i>
        Partner Details
      </h5>

      <div class="row g-4">

        <!-- Name -->
        <div class="col-md-4">
          <label class="form-label fw-semibold">
            Partner Name
          </label>

          <input
            type="text"
            class="form-control"
            [(ngModel)]="partner.name"
            disabled>
        </div>

        <!-- Type -->
        <div class="col-md-4">
          <label class="form-label fw-semibold">
            Partner Type
          </label>

          <select
            class="form-select"
            [(ngModel)]="selectedType"
            name="type">

            @for (type of partnerTypes; track type) {
              <option [value]="type">
                {{ type }}
              </option>
            }
          </select>
        </div>

        <!-- Status -->
        <div class="col-md-4">
          <label class="form-label fw-semibold">
            Status
          </label>

          <select
            class="form-select"
            [(ngModel)]="selectedStatus"
            name="status">

            @for (status of partnerStatuses; track status) {
              <option [value]="status">
                {{ status }}
              </option>
            }
          </select>
        </div>

      </div>

      <!-- Buttons -->
      <div class="mt-4 d-flex gap-3">

        <button
          class="btn btn-primary"
          type="button"
          [disabled]="isLoading"
          (click)="updatePartner()">

          <i class="bi bi-save me-2"></i>

          {{
            isLoading
              ? 'Updating...'
              : 'Update Partner'
          }}
        </button>

        <button
          class="btn btn-outline-secondary"
          type="button"
          [disabled]="isLoading"
          (click)="resetForm()">

          <i class="bi bi-arrow-clockwise me-2"></i>
          Reset
        </button>

      </div>

      }

    </div>
  </div>

</div>


<!-- Success/Error Popup -->
@if (showPopup) {

<div
  style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0,0,0,0.5);
    z-index: 999999;
    display: flex;
    justify-content: center;
    align-items: center;">

  <div
    style="
      width: 450px;
      max-width: 90%;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);">

    <!-- Header -->
    <div
      style="
        background: #0d6efd;
        color: white;
        padding: 16px 20px;
        font-size: 22px;
        font-weight: 600;">
      {{ popupTitle }}
    </div>

    <!-- Body -->
    <div
      style="
        padding: 30px;
        text-align: center;">

      <i
        class="bi bi-check-circle-fill text-success"
        style="font-size: 70px;">
      </i>

      <p
        style="
          margin-top: 15px;
          margin-bottom: 25px;
          font-size: 18px;">
        {{ popupMessage }}
      </p>

      <button
        class="btn btn-primary"
        type="button"
        (click)="closePopup()">
        OK
      </button>

    </div>

  </div>

</div>

}
