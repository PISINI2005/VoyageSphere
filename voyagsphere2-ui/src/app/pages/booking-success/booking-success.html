<div class="success-page">

  <div class="success-card">

    <div class="success-icon">
      ✓
    </div>

    <h1 class="fw-bold mt-4">
      Booking Confirmed
    </h1>

    <p class="text-muted">
      Your reservation was completed successfully.
    </p>

    <div class="booking-number">

      Booking ID

      <strong>
        #{{ bookingId }}
      </strong>

    </div>

    <button
      class="btn btn-primary rounded-pill px-5 mt-4"
      (click)="viewTrips()">

      View My Trips

    </button>

  </div>

</div>
