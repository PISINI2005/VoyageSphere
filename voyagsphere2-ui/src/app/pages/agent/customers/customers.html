<app-agent-navbar></app-agent-navbar>

<div class="container py-4">

  <h2 class="fw-bold mb-4">
    Customer Management
  </h2>

  <div *ngIf="isLoading" class="p-5 text-center">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-3 text-muted">Fetching customers...</p>
  </div>

  <div class="card shadow-sm" *ngIf="!isLoading">

    <div class="list-group list-group-flush">

      @for (customer of customers; track customer.userId) {

        <div
          class="list-group-item d-flex justify-content-between align-items-center">

          <div>

            <div class="fw-bold">
              {{ customer.email }}
            </div>

            <small class="text-muted">
              Status: {{ customer.status }}
            </small>

          </div>

          <button
            class="btn btn-primary rounded-pill"
            (click)="selectCustomer(customer)">

            Open

          </button>

        </div>

      } @empty {

        <div class="list-group-item text-center text-muted py-4">
          No customers found
        </div>

      }

    </div>

  </div>

</div>
