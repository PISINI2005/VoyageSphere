<app-agent-navbar></app-agent-navbar>

<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">Customer Bookings</h2>
    <a routerLink="/agent/customers" class="btn btn-outline-primary rounded-pill">
      Back to Workspace
    </a>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-0">
      <div *ngIf="isLoading" class="p-5 text-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3 text-muted">Fetching bookings...</p>
      </div>

      <div *ngIf="!isLoading && bookings.length === 0" class="p-5 text-center">
        <h4 class="text-muted">No bookings found for this customer.</h4>
        <p>Start by creating a new booking from the workspace.</p>
      </div>

      <div class="table-responsive" *ngIf="!isLoading && bookings.length > 0">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th class="ps-4">Booking ID</th>
              <th>Service Type</th>
              <th>Date</th>
              <th>Status</th>
              <th class="text-end pe-4">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let b of bookings">
              <td class="ps-4 fw-medium">#{{ b.bookingId }}</td>
              <td>
                <span class="badge rounded-pill" [ngClass]="{
                  'bg-primary': b.bookingType === 'FLIGHT',
                  'bg-success': b.bookingType === 'HOTEL',
                  'bg-warning text-dark': b.bookingType === 'PACKAGE',
                  'bg-info text-white': b.bookingType === 'TRANSPORT'
                }">
                  {{ b.bookingType }}
                </span>
              </td>
              <td>{{ b.travelDate || 'N/A' }}</td>
              <td>
                <span class="badge" [ngClass]="{
                  'bg-success': b.status === 'CONFIRMED',
                  'bg-danger': b.status === 'CANCELLED',
                  'bg-secondary': b.status === 'PENDING'
                }">
                  {{ b.status }}
                </span>
              </td>
              <td class="text-end pe-4">
                <button
                  (click)="viewDetails(b.bookingId)"
                  class="btn btn-sm btn-outline-secondary rounded-pill">
                  Details
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
