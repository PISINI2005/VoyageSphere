<app-agent-navbar></app-agent-navbar>

<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">Edit Passenger Profile</h2>
    <button (click)="goBack()" class="btn btn-outline-primary rounded-pill">
      <i class="bi bi-arrow-left me-1"></i> Back
    </button>
  </div>

  <div *ngIf="isLoading" class="p-5 text-center">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-3 text-muted">Fetching profile details...</p>
  </div>

  <div *ngIf="!isLoading" class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <form (ngSubmit)="saveProfile()" #profileForm="ngForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label small text-muted">Full Name</label>
                <input
                  type="text"
                  class="form-control"
                  [(ngModel)]="profile.passengerName"
                  name="passengerName"
                  required>
              </div>
              <div class="col-md-6">
                <label class="form-label small text-muted">Date of Birth</label>
                <input
                  type="date"
                  class="form-control"
                  [(ngModel)]="profile.dateOfBirth"
                  name="dateOfBirth"
                  required>
              </div>
              <div class="col-md-6">
                <label class="form-label small text-muted">Gender</label>
                <select
                  class="form-select"
                  [(ngModel)]="profile.gender"
                  name="gender"
                  required>
                  <option value="MALE">Male</option>
                  <option value="FEMALE">Female</option>
                  <option value="OTHER">Other</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label small text-muted">Email Address</label>
                <input
                  type="email"
                  class="form-control"
                  [(ngModel)]="profile.emailAddress"
                  name="emailAddress"
                  required>
              </div>
              <div class="col-md-6">
                <label class="form-label small text-muted">Contact Number</label>
                <input
                  type="text"
                  class="form-control"
                  [(ngModel)]="profile.contactNo"
                  name="contactNo"
                  required>
              </div>
              <div class="col-md-6">
                <label class="form-label small text-muted">Nationality</label>
                <input
                  type="text"
                  class="form-control"
                  [(ngModel)]="profile.nationality"
                  name="nationality"
                  required>
              </div>
              <div class="col-md-6">
                <label class="form-label small text-muted">Identification Type</label>
                <input
                  type="text"
                  class="form-control"
                  [(ngModel)]="profile.identificationType"
                  name="identificationType"
                  required>
              </div>
              <div class="col-md-6">
                <label class="form-label small text-muted">Identification Number</label>
                <input
                  type="text"
                  class="form-control"
                  [(ngModel)]="profile.identificationNumber"
                  name="identificationNumber"
                  required>
              </div>
            </div>

            <div class="d-grid gap-2 mt-4">
              <button type="submit" class="btn btn-primary rounded-pill py-2 fw-bold" [disabled]="!profileForm.form.valid">
                Save Changes
              </button>
              <button type="button" (click)="goBack()" class="btn btn-light rounded-pill py-2">
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
