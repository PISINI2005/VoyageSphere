<div class="filter-card p-3 bg-light rounded">
  <h5 class="fw-bold mb-4">Filters</h5>

  <div class="mb-4">
    <label class="fw-semibold mb-3">Price Range</label>

    <!-- Min Price Slider -->
    <div class="mb-4">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="price-label">Minimum Price</span>
        <span class="price-value">₹{{ minPrice }}</span>
      </div>
      <input
        type="range"
        class="form-range"
        min="0"
        max="100000"
        [(ngModel)]="minPrice"
        (ngModelChange)="updateFilters()">
    </div>

    <!-- Max Price Slider -->
    <div class="mb-4">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="price-label">Maximum Price</span>
        <span class="price-value">₹{{ maxPrice }}</span>
      </div>
      <input
        type="range"
        class="form-range"
        min="0"
        max="100000"
        [(ngModel)]="maxPrice"
        (ngModelChange)="updateFilters()">
    </div>
  </div>

  <div class="mb-4">
    <label class="fw-semibold mb-2">Rating</label>
    <div class="form-check mb-2">
      <input class="form-check-input" type="radio" name="ratingFilter" id="rate4" [checked]="minRating === 4" (change)="setRating(4)">
      <label class="form-check-label" for="rate4">4★ & Above</label>
    </div>
    <div class="form-check mb-2">
      <input class="form-check-input" type="radio" name="ratingFilter" id="rate3" [checked]="minRating === 3" (change)="setRating(3)">
      <label class="form-check-label" for="rate3">3★ & Above</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" name="ratingFilter" id="rate0" [checked]="minRating === 0" (change)="setRating(0)">
      <label class="form-check-label" for="rate0">All Ratings</label>
    </div>
  </div>

  @if(type === 'PACKAGE') {
  <div class="mb-4">
    <label class="fw-semibold mb-2">Category</label>
    <select class="form-select" [(ngModel)]="category" (ngModelChange)="updateFilters()">
      <option value="">All Categories</option>
      <option value="ADVENTURE">Adventure</option>
      <option value="FAMILY">Family</option>
      <option value="HONEYMOON">Honeymoon</option>
      <option value="LUXURY">Luxury</option>
      <option value="BUDGET">Budget</option>
      <option value="WEEKEND_GETAWAY">Weekend Getaway</option>
    </select>
  </div>
  }

</div>
