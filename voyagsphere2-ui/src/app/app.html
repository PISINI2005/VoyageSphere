<div class="app-container">
  <!-- Theme Toggle Button -->
  <button 
    class="theme-toggle-btn" 
    (click)="toggleTheme()" 
    title="Toggle dark/light theme"
    [attr.aria-label]="(theme$ | async) === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'">
    <i class="bi" [ngClass]="(theme$ | async) === 'dark' ? 'bi-sun-fill' : 'bi-moon-fill'"></i>
  </button>
  
  <router-outlet></router-outlet>
</div>
