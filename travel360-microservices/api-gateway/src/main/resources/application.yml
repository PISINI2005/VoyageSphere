spring:
  application:
    name: api-gateway
  config:
    # Pull routes + port from the Config Server (api-gateway.yml). 'optional:' lets the
    # gateway still boot for local debugging if the config server is briefly unavailable.
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
