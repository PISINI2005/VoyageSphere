server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    # 'native' = serve configuration from the classpath/filesystem instead of a Git backend.
    # Swap to a Git backend in production by removing this profile and setting
    # spring.cloud.config.server.git.uri.
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config

# Config Server registers with Eureka so clients can discover it via the registry.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
