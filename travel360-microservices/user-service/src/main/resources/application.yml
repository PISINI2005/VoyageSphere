spring:
  application:
    name: user-service
  config:
    # Bootstrap configuration (port, datasource, JWT secret) from the Config Server.
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
